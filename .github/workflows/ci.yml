name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the site, serves it, and runs the privacy, CSP and UI tests.
      - run: pnpm test
      # Same suite against a build with analytics enabled, to prove events stay on /ingest without cookies.
      - run: pnpm test tests/analytics.spec.ts
        env:
          PUBLIC_POSTHOG_KEY: phc_ci_dummy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
